<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support tickets</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .wrap{max-width:1240px;margin:28px auto;padding:0 16px}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--mute);margin-bottom:16px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
  .stat b{display:block;font-size:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
  table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;color:var(--mute);background:#fafafa;position:sticky;top:0}
  td.msg{max-width:420px} tr.new{animation:flash 1.6s ease-out}
  @keyframes flash{from{background:#fff7d6}to{background:transparent}}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
  .question{background:#e0f2fe;color:#075985}.order{background:#dcfce7;color:#166534}.complaint{background:#fee2e2;color:#991b1b}.spam{background:#e5e7eb;color:#374151}
  .yes{color:#b91c1c;font-weight:700}
</style></head><body><div class="wrap">
<h1>Support tickets</h1>
<div class="sub">Live view of <code>data/tickets.csv</code> — the Google Sheets stub written by the n8n workflow</div>
<div class="stats" id="stats"></div>
<div class="card"><table><thead><tr><th>Time</th><th>Customer</th><th>Channel</th><th>Category</th><th>Message</th><th>FAQ</th><th>Manager</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);rows.push(r)}return rows}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let seen=new Set(), first=true;
async function load(){
  try{
    const t=await (await fetch('../data/tickets.csv?'+Date.now())).text();
    const [head,...data]=parseCSV(t); const idx=Object.fromEntries(head.map((h,i)=>[h,i]));
    const recs=data.filter(r=>r.length>5).map(r=>Object.fromEntries(head.map(h=>[h,r[idx[h]]]))).reverse();
    const by=k=>recs.filter(r=>r.category==k).length;
    document.getElementById('stats').innerHTML=[['Total',recs.length],['Questions',by('question')],['Orders',by('order')],['Complaints',by('complaint')],['Spam',by('spam')],['To manager',recs.filter(r=>r.escalated=='yes').length]]
      .map(([k,v])=>`<div class="stat">${k}<b>${v}</b></div>`).join('');
    document.getElementById('rows').innerHTML=recs.map(r=>`<tr class="${!first&&!seen.has(r.ticket_id)?'new':''}">
      <td>${esc(new Date(r.received_at).toLocaleTimeString('en-GB'))}</td><td>${esc(r.name)}<br><span style="color:#6b7280">${esc(r.email)}</span></td>
      <td>${esc(r.channel)}</td><td><span class="tag ${esc(r.category)}">${esc(r.category)}</span></td>
      <td class="msg">${esc(r.message)}</td><td>${esc(r.faq_id||'—')}</td><td class="${r.escalated}">${r.escalated=='yes'?'notified':'—'}</td><td>${esc(r.status)}</td></tr>`).join('');
    recs.forEach(r=>seen.add(r.ticket_id)); first=false;
  }catch(e){}
}
load(); setInterval(load,1500);
</script></body></html>
